<svg width="100" height="100" viewBox="5.40 5.90 89.20 89.20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Trusted by families — a house in grey line art with the gradient heart
    inside it.

    Drawn because the supplied folder had five files for six pillars and this
    was the one with none. A house holding a heart says "trusted in homes",
    which is what the pillar's own words claim, and it avoids repeating the
    thumbs-up already spent on "Recognised By".

    Palette and construction follow the four supplied icons exactly: #484848
    line art, one gradient element, blue through magenta.
  -->
  <defs>
    <linearGradient id="trustGrad" x1="34" y1="46" x2="66" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6090C0" />
      <stop offset="0.55" stop-color="#A86090" />
      <stop offset="1" stop-color="#C04878" />
    </linearGradient>
  </defs>

  <g stroke="#484848" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Roof, then the walls under it. -->
    <path d="M12 45L50 15L88 45" />
    <path d="M21 39V83C21 84.7 22.3 86 24 86H76C77.7 86 79 84.7 79 83V39" />
    <path d="M12 86H88" />
    <!-- Chimney. -->
    <path d="M68 26V21H75V32" />
  </g>

  <!-- The heart, the one gradient element. -->
  <path
    d="M50 76C50 76 33 66.2 33 55.6C33 50.3 37.1 46 42.2 46C45.4 46 48.3 47.7 50 50.3C51.7 47.7 54.6 46 57.8 46C62.9 46 67 50.3 67 55.6C67 66.2 50 76 50 76Z"
    fill="url(#trustGrad)"
  />
</svg>
